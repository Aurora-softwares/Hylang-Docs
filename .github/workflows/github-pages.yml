name: Publish Hydrogen Docs to GitHub Pages

on:
  push:
    branches: [Release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hydrogen-docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release
        uses: actions/checkout@v4
      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: '24'
          build-cmd: npm run build:pages
        env:
          SITE_URL: https://aurora-softwares.github.io
          SITE_BASE: /Hylang-Docs

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
