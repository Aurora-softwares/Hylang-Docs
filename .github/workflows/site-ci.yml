name: Hydrogen site and registry

on:
  push:
    branches: [Development, Release, main]
  pull_request:
    branches: [Development, Release, main]

permissions:
  contents: read

jobs:
  macos-installer:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS installer with a verified release fixture
        run: bash tools/test-install.sh

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer with a verified release fixture
        shell: powershell
        run: .\tools\test-install-windows.ps1 -SourceDir $PWD.Path

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check reviewed registry assets
        run: python3 tools/build-registry.py --check
      - name: Test Linux installer against a mocked release
        run: bash tools/test-install.sh
      - name: Build static site
        run: npm run build
      - name: Verify generated pages and starter downloads
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html docs/index.html guides/index.html samples/index.html guides/first-project/index.html; do
            test -s "dist/$page" || { echo "::error::Missing generated route: /$page"; exit 1; }
          done
          grep -q "Hello, Hydrogen" dist/index.html || { echo "::error::Welcome page content is missing"; exit 1; }
          for sample in hello.hy count-to-five.hy greet-you.hy; do
            cmp "public/samples/$sample" "dist/samples/$sample" || { echo "::error::Sample missing or changed: $sample"; exit 1; }
          done
